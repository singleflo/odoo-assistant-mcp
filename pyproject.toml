[project]
name = "odoo-assistant"
version = "1.0.0"
description = "An Odoo virtual employee via MCP: query, create, modify records, run workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Roberto Crotti", email = "bo@fl1.cz" },
]
keywords = ["mcp", "odoo", "erp", "model-context-protocol", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp[cli]>=2.0.0,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
odoo-assistant = "odoo_assistant.server:main"

[project.urls]
Homepage = "https://github.com/singleflo/odoo-assistant-mcp"
Repository = "https://github.com/singleflo/odoo-assistant-mcp"
Issues = "https://github.com/singleflo/odoo-assistant-mcp/issues"
MCPRegistry = "https://registry.modelcontextprotocol.io/servers/io.github.singleflo/odoo-assistant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"references_public" = "odoo_assistant/references"

[tool.hatch.build.targets.sdist]
# Anchored gitignore-style: each segment matches whole, so `/references` drops
# the instance-specific tree and spares `references_public/`, which the wheel
# force-includes above and a rebuild from this sdist needs present.
exclude = ["/references", "/docs", "/.omo", "/.github", "/.opencode"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src/odoo_assistant/odoo_scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a live Odoo instance (needs ODOO_BASE_URL)",
    "wheel: drives the built artifact in dist/ (needs `uv build` and network for uvx)",
]
addopts = "-m 'not live and not wheel'"
